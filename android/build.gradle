// The port on Android (arm64). A single-module Gradle project: this directory is both the Gradle root and
// the application module, so the APK lands in android/build/outputs/apk/. The native code is port/'s
// CMake tree (jni/CMakeLists.txt), from the game's sources port/tools/prepare.py made into
// build/port/gen-arm64 (port/tools/build_android.py runs both).

plugins {
    id 'com.android.application' version '8.7.3'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

// Release signing: a keystore outside the repository, named by environment variables. Without them
// the release build is signed with the debug key, which is fine for sideloading onto a test device.
def keystorePath = System.getenv('KHDAYS_KEYSTORE_PATH')
def keystorePassword = System.getenv('KHDAYS_KEYSTORE_PASSWORD')
def hasReleaseKey = keystorePath?.trim() && keystorePassword?.trim()

// -PkhdaysNative=<dir>: package the native libraries already built there (<dir>/arm64-v8a/*.so: libmain.so,
// libSDL3.so, libc++_shared.so from a tree of android/jni configured with the NDK) instead of building
// port/ again through Gradle.
// The Android release: upstream's version (the VERSION file) and this build's beta of it, 0 for the
// version itself. Released as android-<version>-beta<n> (0.1.4-beta1), which the update check compares.
def upstreamVersion = file("${rootDir}/../VERSION").text.trim()
def betaNumber = 6
def versionSuffix = betaNumber > 0 ? "-beta${betaNumber}" : ''
// each release installs over the one before (Android refuses a lower code): 0.1.4 beta 1 is 10401,
// 0.1.4 itself 10499, 0.1.5 beta 1 10501
def releaseCode = upstreamVersion.tokenize('.').with {
    (it[0].toInteger() * 10000 + it[1].toInteger() * 100 + it[2].toInteger()) * 100 + (betaNumber > 0 ? betaNumber : 99)
}

def prebuiltNative = project.hasProperty('khdaysNative') ? file(project.property('khdaysNative')) : null

// tools/supported_roms.json, the one list of supported ROMs the PC installer also checks, packaged as the
// asset supported_roms.json for the on-device setup (setup/SupportedRoms.kt)
def supportedRomsJson = file("${rootDir}/../tools/supported_roms.json")
def supportedRomsAssets = layout.buildDirectory.dir('generated/supported-roms-assets')
def copySupportedRoms = tasks.register('copySupportedRoms', Sync) {
    from supportedRomsJson
    into supportedRomsAssets
}
tasks.named('preBuild') { dependsOn copySupportedRoms }

// The setup's tests: the real ROMs and the PC tools' extractions they are compared with are named by
// -PkhdaysRomEu=, -PkhdaysRomUs=, -PkhdaysReferenceEu=, -PkhdaysReferenceUs= (or the environment's
// KHDAYS_ROM_EU, ...); the tests that need them are skipped when they are missing.
def setupTestProperties = ['khdaysRomEu', 'khdaysRomUs', 'khdaysReferenceEu', 'khdaysReferenceUs']

android {
    namespace 'com.sonofskywalker3.khdays358'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.sonofskywalker3.khdays358'
        minSdk 29
        targetSdk 35
        versionName upstreamVersion + versionSuffix
        versionCode releaseCode

        ndk {
            // 64-bit ARM: the game's memory is a 2 GB window anywhere in the address space, its
            // pointers 4-byte references into it (docs/PLATFORM.md)
            abiFilters 'arm64-v8a'
        }
        if (prebuiltNative == null) externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DANDROID_PLATFORM=android-29',
                          "-DKHDAYS_GEN=${rootDir}/../build/port/gen-arm64",
                          "-DKHDAYS_VERSION_SUFFIX=${versionSuffix}"
                // libmain.so (the game) and libSDL3.so; AGP packages them with libc++_shared.so
                targets 'khdays-native', 'SDL3-shared'
            }
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias 'khdays'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            if (prebuiltNative == null) externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
        debug {
            jniDebuggable true
            // optimised with symbols: an unoptimised game is far too slow to test with
            if (prebuiltNative == null) externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
    }

    if (prebuiltNative == null) {
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version '3.31.6'
            }
        }
    } else {
        sourceSets.main.jniLibs.srcDirs = [prebuiltNative]
    }

    sourceSets.main.assets.srcDir(supportedRomsAssets)

    testOptions {
        unitTests.all { test ->
            test.maxHeapSize = '1g'
            test.systemProperty 'khdays.supportedRoms', supportedRomsJson.absolutePath
            setupTestProperties.each { name ->
                if (project.hasProperty(name)) test.systemProperty name, project.property(name)
            }
            test.testLogging {
                events 'passed', 'skipped', 'failed'
                showStandardStreams = true
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            // SDL's HIDAPI opens USB devices through JNI; nothing needs the legacy extraction
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
