name: Build

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The data-format library, the mod layer and the filesystem, with their
  # tests, on each platform. (The native game build, port/build.py, needs
  # the user's game data and is not built here.)
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: Linux x64
            os: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S assets -B build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DBUILD_TESTING=ON

      - name: Configure Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S assets -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Python tool tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

  sanitizers:
    name: Sanitizers (Linux x64)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Configure with sanitizers
        shell: bash
        run: |
          cmake -S assets -B build-san \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DKHDAYS_ENABLE_SANITIZERS=ON

      - name: Build sanitized tests
        # One aggregate target defined in assets/CMakeLists.txt next to the tests, so a
        # new test never needs a matching edit here.
        run: cmake --build build-san --target khdays-asset-tests

      - name: Run tests under ASan and UBSan
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure
